<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#821a2f">
<title>مراجعة التصميمات · ترند</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --brand:#821a2f; --brand-ink:#fff; --brand-soft:#f5e6e9; --gold:#c9780a;
  --bg:#fbf8f9; --surface:#fff; --line:#ecdfe2; --fg:#23161a; --muted:#76626a; --chip:#f5ecee;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --warn:#a85f00; --warn-soft:#fdf0dc; --bad:#b3261e; --bad-soft:#fbe7e5;
  --info:#7a5560; --info-soft:#f3ecee;
  --display:"Alexandria","Segoe UI",Tahoma,sans-serif; --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(35,22,26,.06),0 6px 20px rgba(35,22,26,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#b13a53; --brand-soft:#3a1d25; --gold:#f0a640;
  --bg:#150c0f; --surface:#20151a; --line:#3a2a30; --fg:#f5eaed; --muted:#b9a3ab; --chip:#2c1d23;
  --ok:#5cc98f; --ok-soft:#173326; --warn:#f0b04a; --warn-soft:#3a2a12; --bad:#ff8a80; --bad-soft:#3d1a18;
  --info:#d8b9c2; --info-soft:#2c1d23; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --brand:#b13a53; --brand-soft:#3a1d25; --gold:#f0a640;
  --bg:#150c0f; --surface:#20151a; --line:#3a2a30; --fg:#f5eaed; --muted:#b9a3ab; --chip:#2c1d23;
  --ok:#5cc98f; --ok-soft:#173326; --warn:#f0b04a; --warn-soft:#3a2a12; --bad:#ff8a80; --bad-soft:#3d1a18;
  --info:#d8b9c2; --info-soft:#2c1d23; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);line-height:1.3;margin:0}
h1{font-size:1.45rem} h2{font-size:1.15rem} h3{font-size:1rem}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
img{max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font:800 14px var(--display);letter-spacing:.5px;flex:none;text-decoration:none}
.brandname{font:700 .98rem var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandname small{display:block;font:500 .75rem var(--body);color:var(--muted)}
.who{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
@media (max-width:560px){.who{display:none}}
.demo-bar{background:var(--warn-soft);color:var(--warn);font-size:.85rem;text-align:center;padding:6px 16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 15px;cursor:pointer;font-weight:600;text-decoration:none;min-height:42px;transition:background .15s,border-color .15s}
.btn:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--brand) 88%,#000)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--chip)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:.88rem;border-radius:9px}
.btn.block{width:100%}
.iconbtn{width:40px;height:40px;padding:0;border-radius:50%}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
main{padding:22px 0 60px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);margin-bottom:10px}
.crumbs a{text-decoration:none} .crumbs a:hover{color:var(--brand)}
.pagehead{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.pagehead .grow{flex:1;min-width:200px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-pending{background:var(--info-soft);color:var(--info)}
.b-changes{background:var(--warn-soft);color:var(--warn)}
.b-approved{background:var(--ok-soft);color:var(--ok)}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:.78rem;background:var(--chip);color:var(--muted);white-space:nowrap}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{padding:14px 16px}
.stat b{display:block;font:800 1.6rem var(--display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
.stat.hl b{color:var(--warn)}

/* lists */
.list{display:grid;gap:10px}
.item{display:flex;gap:14px;align-items:center;padding:14px 16px;text-decoration:none}
a.item:hover{border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.item .grow{flex:1;min-width:0}
.item h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font:800 1rem var(--display);flex:none}
.progress{height:6px;border-radius:99px;background:var(--chip);overflow:hidden;display:flex;margin-top:8px}
.progress i{display:block;height:100%}
.progress .p-ok{background:var(--ok)} .progress .p-ch{background:var(--warn)}

/* grid of designs */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.dcard{overflow:hidden;text-decoration:none;display:flex;flex-direction:column}
a.dcard:hover{border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.thumb{position:relative;aspect-ratio:4/5;background:var(--chip);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .count{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;font-size:.75rem;padding:1px 7px}
.thumb .ver{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;font-size:.75rem;padding:1px 7px}
.dcard .meta{padding:10px 12px 12px;display:grid;gap:6px}
.dcard h3{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* watermark */
.wm{position:absolute;inset:0;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22240%22%20height%3D%22150%22%3E%3Cg%20transform%3D%22rotate%28-28%20120%2075%29%22%3E%3Ctext%20x%3D%22120%22%20y%3D%2282%22%20text-anchor%3D%22middle%22%20font-family%3D%22Tahoma%2CArial%2Csans-serif%22%20font-size%3D%2222%22%20font-weight%3D%22700%22%20fill%3D%22%23ffffff%22%20fill-opacity%3D%22.34%22%20stroke%3D%22%23000000%22%20stroke-opacity%3D%22.12%22%20stroke-width%3D%221%22%3E%D9%85%D8%B3%D9%88%D8%AF%D8%A9%20%C2%B7%20%D8%AA%D8%B1%D9%86%D8%AF%3C/text%3E%3C/g%3E%3C/svg%3E");background-size:240px 150px}

/* design page */
.dlayout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
@media (max-width:900px){.dlayout{grid-template-columns:1fr}}
.stagebox{padding:14px;display:grid;gap:12px}
.stage{display:flex;justify-content:center;align-items:center;background:var(--chip);border-radius:12px;padding:10px;min-height:280px;position:relative;user-select:none}
.imgwrap{position:relative;display:inline-block;line-height:0;max-width:100%}
.imgwrap img{display:block;max-width:100%;max-height:72vh;border-radius:6px;-webkit-user-drag:none}
.imgwrap.can-pin{cursor:crosshair}
.pin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;border:2px solid #fff;font:700 13px/24px var(--body);text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer;padding:0;z-index:2}
.pin.done{background:var(--ok)}
.pin.draft{background:var(--gold);animation:pulse 1.2s infinite}
.pin.active{outline:3px solid var(--gold);outline-offset:1px}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.15)}}
.navarrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;background:rgba(0,0,0,.55);color:#fff;border:0}
.navarrow.prev{right:8px} .navarrow.next{left:8px}
.dots{display:flex;justify-content:center;gap:6px}
.dots button{width:9px;height:9px;border-radius:50%;border:0;background:var(--line);padding:0;cursor:pointer}
.dots button.on{background:var(--brand)}
.hint{font-size:.85rem;color:var(--muted);text-align:center}
.caption{white-space:pre-wrap;background:var(--chip);border-radius:10px;padding:10px 12px;font-size:.92rem}
.side{display:grid;gap:14px}
.side .card{padding:16px}
.sticky{position:sticky;top:76px}
@media (max-width:900px){.sticky{position:static}}
.comments{display:grid;gap:8px}
.cmt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px;background:var(--surface)}
.cmt.active{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 30%,transparent)}
.cmt.done{opacity:.7}
.cmt.done .body{text-decoration:line-through}
.cmt .head{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.num{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font:700 12px/22px var(--body);text-align:center;flex:none}
.num.gen{background:var(--muted)}
.num.done{background:var(--ok)}
.cmt .body{white-space:pre-wrap;font-size:.93rem}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats label{cursor:pointer}
.cats input{position:absolute;opacity:0;pointer-events:none}
.cats span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.85rem}
.cats input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}
.cats input:focus-visible+span{outline:2px solid var(--gold)}
.draftbox{border:2px dashed var(--gold);border-radius:12px;padding:12px;display:grid;gap:10px}
.reviewbar{display:grid;gap:8px}
.notice{border-radius:12px;padding:10px 12px;font-size:.9rem}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--info-soft);color:var(--info)}
.events{display:grid;gap:6px;font-size:.85rem}
.events div{display:flex;gap:8px}
.events time{color:var(--muted);white-space:nowrap}
.vers{display:flex;gap:6px;flex-wrap:wrap}
.vers button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;cursor:pointer;font-size:.85rem}
.vers button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* forms */
label.f{display:grid;gap:5px;font-size:.88rem;font-weight:600}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;font-weight:400}
textarea.input{min-height:90px;resize:vertical}
.input:focus{outline:2px solid color-mix(in srgb,var(--brand) 50%,transparent);border-color:var(--brand)}
.form{display:grid;gap:12px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.form .two{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:.88rem;min-height:1em}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}

/* login */
.login{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:24px 16px}
.login .card{width:100%;max-width:400px;padding:28px 24px}
.login .logo{width:56px;height:56px;font-size:20px;border-radius:16px;margin:0 auto 14px}
.demo-acc{font-size:.85rem;background:var(--chip);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.demo-acc button{all:unset;cursor:pointer;color:var(--brand);font-weight:600;text-decoration:underline}

/* dialog */
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--fg);width:min(520px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,8,12,.5)}
dialog .dh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
dialog .db{padding:18px}
dialog .df{display:flex;gap:8px;justify-content:flex-start;padding:0 18px 18px}

/* toast */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(440px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--bg);border-radius:12px;padding:11px 14px;font-size:.92rem;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.toast.bad{background:var(--bad);color:#fff}
.toast a{color:inherit;font-weight:700}

.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font:700 1.05rem var(--display);margin-bottom:4px}
.section{margin-top:26px}
.section > .row{margin-bottom:12px}
.loading{display:grid;place-items:center;padding:60px;color:var(--muted)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.inbox-group{padding:14px 16px;display:grid;gap:10px}
.inbox-design{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.inbox-design:first-of-type{border-top:0;padding-top:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="demoBar" class="demo-bar hidden">نسخة تجريبية: البيانات وهمية ومتسجلة على جهازك بس. اربط Supabase من ملف <b>config.js</b> عشان تشتغل بجد.</div>
<header class="top"><div class="wrap">
  <a class="logo" href="#/" aria-label="الرئيسية">TR</a>
  <div class="brandname">مراجعة التصميمات<small>ترند للدعاية والإعلان</small></div>
  <div class="spacer"></div>
  <span id="who" class="who"></span>
  <button id="themeBtn" class="btn ghost iconbtn" title="تغيير المظهر" aria-label="تغيير المظهر"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
  <button id="logoutBtn" class="btn sm hidden">خروج</button>
</div></header>
<div id="app"><div class="loading"><div class="spin"></div></div></div>
<div id="toast" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>

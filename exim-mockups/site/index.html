<style>
/* Layout: one column on phones, preview beside controls on wide screens */
:root{
  --teal:#0c5d69; --teal-2:#138a99; --fuchsia:#d4146f;
  --bg:#f3f6f6; --surface:#ffffff; --fg:#13292d; --muted:#5b6f73; --line:#d6e1e2;
  --font:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1a1c; --surface:#142629; --fg:#e8f1f2; --muted:#9db3b6; --line:#25403f; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a1c; --surface:#142629; --fg:#e8f1f2; --muted:#9db3b6; --line:#25403f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);direction:rtl;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:20px}
header{display:flex;align-items:center;gap:14px}
header img{height:52px;width:auto}
header h1{font-size:clamp(22px,4vw,30px);margin:0;font-weight:900;color:var(--fg);text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:15px}
.main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;justify-items:center}
canvas{max-width:100%;height:auto;max-height:72vh;border-radius:10px;touch-action:none;cursor:grab;display:block}
canvas.dragging{cursor:grabbing}
.hint{color:var(--muted);font-size:13px;margin-top:8px;text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:18px}
.step{display:grid;gap:8px}
.step>span{font-weight:700;font-size:15px}
.upload{display:grid;place-items:center;gap:4px;border:2px dashed var(--teal-2);border-radius:14px;padding:22px 12px;text-align:center;cursor:pointer;background:color-mix(in srgb,var(--teal-2) 7%,transparent)}
.upload:hover,.upload:focus-within{background:color-mix(in srgb,var(--teal-2) 14%,transparent)}
.upload b{font-size:17px;color:var(--fg)}
.upload small{color:var(--muted)}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 120px;font:inherit;font-weight:700;padding:10px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
input[type=range]{width:100%;direction:ltr;accent-color:var(--fuchsia)}
input[type=text]{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
button:focus-visible,input:focus-visible,.upload:focus-within{outline:3px solid var(--fuchsia);outline-offset:2px}
.save{font:inherit;font-weight:900;font-size:18px;padding:14px;border:0;border-radius:14px;background:var(--fuchsia);color:#fff;cursor:pointer}
.save:disabled{opacity:.45;cursor:not-allowed}
.status{min-height:22px;color:var(--muted);font-size:14px;text-align:center;margin:0}
.result{display:grid;gap:8px;justify-items:center}
.result img{max-width:240px;border-radius:10px;border:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.save,.seg button{transition:background .15s}}
</style>

      <h1>اعمل صورتك بفريم العمرة</h1>
      <p>ارفع صورتك من رحلة العمرة، ونزّلها بفريم إكسيم تورز وشاركها بالهاشتاج #عمرة_مع_إكسيم</p>

  <div class="main">
    <div class="stage">
      <canvas id="cv" width="1080" height="1350" aria-label="معاينة الصورة بالفريم"></canvas>
      <p class="hint" id="hint">اسحب الصورة بإيدك علشان تظبط مكانها</p>
    </div>

    <div class="panel">
      <label class="step">
        <span>صورتك</span>
        <div class="upload">
          <input type="file" id="file" accept="image/*">
          <b id="upTitle">اختار صورة من موبايلك</b>
          <small>أو اسحب الصورة وحطها هنا</small>
        </div>
      </label>

      <div class="step">
        <span>شكل الصورة</span>
        <div class="seg" id="fmt">
          <button type="button" data-v="post" aria-pressed="true">بوست 4:5</button>
          <button type="button" data-v="story" aria-pressed="false">ستوري 9:16</button>
        </div>
      </div>

      <div class="step">
        <span>العنوان</span>
        <div class="seg" id="ttl">
          <button type="button" data-v="0" aria-pressed="true">أنا رايح العمرة</button>
          <button type="button" data-v="1" aria-pressed="false">تقبّل الله عمرتي</button>
        </div>
      </div>

      <label class="step">
        <span>تكبير الصورة</span>
        <input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
      </label>

      <label class="step">
        <span>اسمك (اختياري)</span>
        <input type="text" id="name" maxlength="28" placeholder="مثلًا: الحاج محمد أحمد">
      </label>

      <button class="save" id="save" disabled>نزّل الصورة</button>
      <p class="status" id="status" role="status"></p>
      <div class="result" id="result" hidden>
        <img id="resultImg" alt="الصورة النهائية">
        <small style="color:var(--muted)">لو التنزيل ما اشتغلش، دوس على الصورة دي ضغطة طويلة واختار حفظ الصورة</small>
      </div>
    </div>
  </div>

const st = {fmt:'post', title:0, zoom:1, ox:0, oy:0, img:null, name:''};

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function win(){const f=FORMATS[st.fmt];return {x:60,y:f.top,w:f.w-120,h:f.h-f.top-f.bottom};}

function pattern(w,h){
  ctx.save();ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=2;
  for(let y=0;y<h+80;y+=80)for(let x=0;x<w+80;x+=80){
    ctx.beginPath();const cx=x+40,cy=y+40;
    for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?16:36;ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}
    ctx.closePath();ctx.stroke();
    ctx.strokeRect(cx-14,cy-14,28,28);
  }
  ctx.restore();
}

function photoRect(){
  const W=win(); const im=st.img; if(!im) return null;
  const s=Math.max(W.w/im.width,W.h/im.height)*st.zoom;
  const dw=im.width*s, dh=im.height*s;
  const maxX=(dw-W.w)/2, maxY=(dh-W.h)/2;
  st.ox=Math.max(-maxX,Math.min(maxX,st.ox)); st.oy=Math.max(-maxY,Math.min(maxY,st.oy));
  return {x:W.x+(W.w-dw)/2+st.ox, y:W.y+(W.h-dh)/2+st.oy, w:dw, h:dh};
}

function draw(){
  const f=FORMATS[st.fmt]; if(cv.width!==f.w||cv.height!==f.h){cv.width=f.w;cv.height=f.h;}
  const W=win();
  // background
  ctx.fillStyle=C.teal;ctx.fillRect(0,0,f.w,f.h);pattern(f.w,f.h);
  // bottom wave
  const by=f.h-f.bottom;
  ctx.fillStyle=C.fu;ctx.beginPath();ctx.moveTo(0,by+20);ctx.quadraticCurveTo(f.w/2,by-50,f.w,by+40);ctx.lineTo(f.w,f.h);ctx.lineTo(0,f.h);ctx.closePath();ctx.fill();
  const g=ctx.createLinearGradient(0,0,f.w,0);g.addColorStop(0,C.fuDeep);g.addColorStop(1,C.fu);
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,by+60);ctx.quadraticCurveTo(f.w/2,by,f.w,by+80);ctx.lineTo(f.w,f.h);ctx.lineTo(0,f.h);ctx.closePath();ctx.fill();
  // photo window
  ctx.save();rr(W.x,W.y,W.w,W.h,36);ctx.clip();
  if(st.img){const p=photoRect();ctx.drawImage(st.img,p.x,p.y,p.w,p.h);}
  else{
    ctx.fillStyle='#dfe9ea';ctx.fillRect(W.x,W.y,W.w,W.h);
    ctx.fillStyle='#b5c7c9';
    const cx=W.x+W.w/2, cy=W.y+W.h/2;
    ctx.beginPath();ctx.arc(cx,cy-60,90,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx,cy+170,170,140,0,Math.PI,0);ctx.fill();
    ctx.fillStyle='#6f8a8d';ctx.font=`700 40px ${FONT}`;ctx.textAlign='center';ctx.direction='rtl';
    ctx.fillText('صورتك هنا',cx,W.y+90);
  }
  ctx.restore();
  ctx.lineWidth=12;ctx.strokeStyle=C.white;rr(W.x,W.y,W.w,W.h,36);ctx.stroke();
  // title
  const [t1,t2]=TITLES[st.title];
  ctx.direction='rtl';ctx.textAlign='center';ctx.fillStyle=C.white;
  const ty=st.fmt==='story'?150:110;
  let fs=66;ctx.font=`900 ${fs}px ${FONT}`;while(ctx.measureText(t1).width>f.w-100&&fs>40){fs-=2;ctx.font=`900 ${fs}px ${FONT}`;}
  ctx.fillText(t1,f.w/2,ty);
  ctx.font=`900 34px ${FONT}`;const pw=ctx.measureText(t2).width+70;
  ctx.fillStyle=C.white;rr(f.w/2-pw/2,ty+30,pw,60,30);ctx.fill();
  ctx.fillStyle=C.teal;ctx.fillText(t2,f.w/2,ty+73);
  // name ribbon over photo bottom
  if(st.name.trim()){
    ctx.font=`900 40px ${FONT}`;const nw=Math.min(ctx.measureText(st.name).width+80,W.w-40);
    const ny=W.y+W.h-44;
    ctx.fillStyle='rgba(12,93,105,.92)';rr(f.w/2-nw/2,ny-38,nw,72,36);ctx.fill();
    ctx.fillStyle=C.white;ctx.fillText(st.name.trim(),f.w/2,ny+14,nw-40);
  }
  // footer
  const lh=st.fmt==='story'?190:170, lw=lh*logo.naturalWidth/(logo.naturalHeight||1);
  if(logo.complete&&logo.naturalWidth) ctx.drawImage(logo,70,f.h-lh-(st.fmt==='story'?90:40),lw,lh);
  const fx=f.w-300, fy=f.h-(st.fmt==='story'?200:150);
  ctx.fillStyle=C.white;ctx.textAlign='center';ctx.font=`900 56px ${FONT}`;
  ctx.fillText('#عمرة_مع_إكسيم',fx+10,fy);
  ctx.font=`700 28px ${FONT}`;ctx.globalAlpha=.92;ctx.fillText('رحلة العمر بدأت.. إحنا معاك',fx+10,fy+52);ctx.globalAlpha=1;
}

// interactions
function loadFile(file){
  if(!file||!file.type.startsWith('image/')){$('status').textContent='الملف ده مش صورة. اختار صورة JPG أو PNG.';return;}
  const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{st.img=im;st.ox=st.oy=0;st.zoom=1;$('zoom').value=1;$('save').disabled=false;$('upTitle').textContent='غيّر الصورة';$('status').textContent='';$('result').hidden=true;draw();};
  im.onerror=()=>{$('status').textContent='مقدرناش نفتح الصورة دي. جرّب صورة تانية.';};
  im.src=url;
}
$('file').addEventListener('change',e=>loadFile(e.target.files[0]));
const up=document.querySelector('.upload');
['dragover','dragenter'].forEach(ev=>up.addEventListener(ev,e=>{e.preventDefault();}));
up.addEventListener('drop',e=>{e.preventDefault();loadFile(e.dataTransfer.files[0]);});

function seg(id,key,parse){$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  $(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));st[key]=parse(b.dataset.v);st.ox=st.oy=0;$('result').hidden=true;draw();});}
seg('fmt','fmt',v=>v);seg('ttl','title',v=>+v);
$('zoom').addEventListener('input',e=>{st.zoom=+e.target.value;draw();});
$('name').addEventListener('input',e=>{st.name=e.target.value;draw();});

let drag=null;
cv.addEventListener('pointerdown',e=>{if(!st.img)return;cv.setPointerCapture(e.pointerId);cv.classList.add('dragging');drag={x:e.clientX,y:e.clientY,ox:st.ox,oy:st.oy};});
cv.addEventListener('pointermove',e=>{if(!drag)return;const k=cv.width/cv.getBoundingClientRect().width;st.ox=drag.ox+(e.clientX-drag.x)*k;st.oy=drag.oy+(e.clientY-drag.y)*k;draw();});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{drag=null;cv.classList.remove('dragging');}));
cv.addEventListener('wheel',e=>{if(!st.img)return;e.preventDefault();st.zoom=Math.min(3,Math.max(1,st.zoom-e.deltaY*0.001));$('zoom').value=st.zoom;draw();},{passive:false});

// save
let downloads=null;
if(window.claude&&window.claude.use){window.claude.use('downloads').then(d=>{downloads=d;}).catch(()=>{});}
$('save').addEventListener('click',()=>{
  draw();
  cv.toBlob(async blob=>{
    if(!blob){$('status').textContent='حصلت مشكلة في تجهيز الصورة. جرّب تاني.';return;}
    const fname=`عمرة-مع-إكسيم-${st.fmt==='story'?'ستوري':'بوست'}.jpg`;
    $('resultImg').src=URL.createObjectURL(blob);$('result').hidden=false;
    if(downloads){
      try{await downloads.save({filename:fname,data:blob});$('status').textContent='الصورة اتنزلت. شاركها بالهاشتاج #عمرة_مع_إكسيم';}
      catch(err){$('status').textContent=err&&err.code==='declined'?'التنزيل اتلغى. تقدر تدوس نزّل الصورة تاني.':'التنزيل مش متاح هنا. احفظ الصورة اللي تحت بضغطة طويلة.';}
    }else if(!window.claude){
      const a=document.createElement('a');a.href=$('resultImg').src;a.download=fname;document.body.appendChild(a);a.click();a.remove();
      $('status').textContent='الصورة اتنزلت. شاركها بالهاشتاج #عمرة_مع_إكسيم';
    }else{$('status').textContent='احفظ الصورة اللي تحت بضغطة طويلة عليها.';}
  },'image/jpeg',0.92);
});

logo.onload=draw;
(document.fonts?document.fonts.load(`900 40px Cairo`).then(()=>document.fonts.load(`700 28px Cairo`)):Promise.resolve()).finally(draw);
draw();
})();
</script>
